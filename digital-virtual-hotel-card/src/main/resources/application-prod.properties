# Production Configuration
spring.application.name=Digital Virtual Hotel Card
server.port=${PORT:8080}

# Database Configuration (H2 for demo deployment)
spring.datasource.url=jdbc:h2:mem:hoteldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (disable in production)
spring.h2.console.enabled=false

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN

# Logging
logging.level.com.example.hotelcard=INFO
logging.level.org.springframework.security=WARN