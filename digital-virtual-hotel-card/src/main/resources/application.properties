# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_card_db
spring.datasource.username=hoteluser
spring.datasource.password=hotel123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true


# H2 Console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Security in-memory user
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN
